<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ProofPitch architecture</title>
  <desc id="desc">A React workspace calls a FastAPI service and four ordered Strands tools. Safe listings reach a local human approval record. Hard risks withhold the draft. External sending is disabled.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .ink{fill:#0b1730}.muted{fill:#4f5a71}.box{fill:#ffffff;stroke:#ccd2dc;stroke-width:2}.soft{fill:#f7f9fb;stroke:#ccd2dc;stroke-width:2}.lime{fill:#f3fad8;stroke:#b7e900;stroke-width:3}.red{fill:#fff0ef;stroke:#d9908a;stroke-width:3}.line{fill:none;stroke:#0b1730;stroke-width:3;marker-end:url(#arrow)}.riskline{fill:none;stroke:#b43b32;stroke-width:3;marker-end:url(#redarrow)}
    text{font-family:Inter,Arial,sans-serif}.label{font-size:25px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}.kicker{font-size:17px;font-weight:700;letter-spacing:2px}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b1730"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b43b32"/></marker>
  </defs>

  <text x="70" y="75" class="ink" font-size="44" font-weight="800">ProofPitch</text>
  <text x="70" y="112" class="muted" font-size="22">Evidence-grounded opportunity screening with an explicit safety gate</text>

  <rect x="70" y="190" width="250" height="165" rx="14" class="soft"/>
  <text x="100" y="235" class="muted kicker">INPUT</text>
  <text x="100" y="278" class="ink label">React workspace</text>
  <text x="100" y="312" class="muted small">Synthetic listing +</text>
  <text x="100" y="338" class="muted small">public evidence</text>

  <rect x="400" y="190" width="250" height="165" rx="14" class="box"/>
  <text x="430" y="235" class="muted kicker">API</text>
  <text x="430" y="278" class="ink label">FastAPI</text>
  <text x="430" y="312" class="muted small">Typed request and</text>
  <text x="430" y="338" class="muted small">review response</text>

  <rect x="730" y="155" width="800" height="430" rx="18" class="soft"/>
  <text x="770" y="205" class="muted kicker">STRANDS AGENTS SDK TOOL REGISTRY</text>

  <rect x="770" y="245" width="165" height="110" rx="12" class="box"/>
  <text x="792" y="282" class="ink label">1 · Parse</text>
  <text x="792" y="317" class="muted tiny">Validate listing</text>

  <rect x="965" y="245" width="165" height="110" rx="12" class="box"/>
  <text x="987" y="282" class="ink label">2 · Match</text>
  <text x="987" y="317" class="muted tiny">Public evidence</text>

  <rect x="1160" y="245" width="165" height="110" rx="12" class="box"/>
  <text x="1182" y="282" class="ink label">3 · Risk</text>
  <text x="1182" y="317" class="muted tiny">Hard-signal gate</text>

  <rect x="1355" y="245" width="145" height="110" rx="12" class="lime"/>
  <text x="1375" y="282" class="ink label">4 · Draft</text>
  <text x="1375" y="317" class="muted tiny">Risk-aware</text>

  <path d="M935 300 H965" class="line"/>
  <path d="M1130 300 H1160" class="line"/>
  <path d="M1325 300 H1355" class="line"/>

  <rect x="770" y="415" width="355" height="115" rx="12" class="lime"/>
  <text x="800" y="457" class="ink label">Safe or caveated</text>
  <text x="800" y="491" class="muted small">Grounded draft + visible gaps</text>

  <rect x="1160" y="415" width="340" height="115" rx="12" class="red"/>
  <text x="1190" y="457" fill="#8d2d28" class="label">Hard risk</text>
  <text x="1190" y="491" fill="#8d2d28" class="small">Draft withheld · approval blocked</text>

  <path d="M1242 355 V390 H947 V415" class="line"/>
  <path d="M1242 355 V415" class="riskline"/>

  <path d="M320 265 H400" class="line"/>
  <path d="M650 265 H730" class="line"/>

  <rect x="400" y="665" width="420" height="145" rx="14" class="lime"/>
  <text x="435" y="710" class="muted kicker">LOCAL HUMAN GATE</text>
  <text x="435" y="753" class="ink label">Review record</text>
  <text x="435" y="787" class="muted small">Exact draft stays under operator control</text>

  <rect x="950" y="665" width="420" height="145" rx="14" class="red"/>
  <text x="985" y="710" fill="#8d2d28" class="kicker">HARD BOUNDARY</text>
  <text x="985" y="753" fill="#8d2d28" class="label">External send disabled</text>
  <text x="985" y="787" fill="#8d2d28" class="small">No message, payment, or employer contact route</text>

  <path d="M947 530 V605 H610 V665" class="line"/>
  <path d="M820 737 H950" class="riskline"/>
  <path d="M1330 530 V620 H1160 V665" class="riskline"/>

  <text x="70" y="855" class="muted tiny">Default replay: credential-free, deterministic Strands tool calls · Optional live path: Strands model loop with Amazon Bedrock</text>
</svg>
